name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.mass_matugen.Mass
  BRANCH: stable

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        # The runner's default Ubuntu mirror sometimes crawls. Skip recommended extras (they drag
        # in ffmpeg + Mesa, ~100 MB), give each attempt 3 minutes, and switch mirror on retry.
        timeout-minutes: 12
        run: |
          APT=(-q -o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          MIRRORS=("" "http://azure.archive.ubuntu.com/ubuntu/" "http://archive.ubuntu.com/ubuntu/")
          for try in 0 1 2; do
            if [ -n "${MIRRORS[$try]}" ]; then
              echo "::warning::apt attempt $try stalled or failed; switching to ${MIRRORS[$try]}"
              sudo dpkg --configure -a || true  # finish anything a killed attempt left half-done
              echo "${MIRRORS[$try]}" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            if timeout 180 sudo apt-get "${APT[@]}" update &&
               timeout 180 sudo apt-get "${APT[@]}" install -y --no-install-recommends flatpak flatpak-builder
            then
              break
            fi
            [ "$try" = 2 ] && exit 1
          done
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Runtime version
        id: rt
        run: echo "v=$(grep -m1 '^runtime-version' flatpak/$APP_ID.yml | tr -dc '0-9.')" >> "$GITHUB_OUTPUT"

      - name: Cache GNOME SDK
        # the Platform + Sdk (~1.5 GB) otherwise download on every run; flatpak-builder still
        # pulls any newer point release on top
        uses: actions/cache@v4
        with:
          path: ~/.local/share/flatpak
          key: flatpak-sdk-gnome-${{ steps.rt.outputs.v }}  # saved once per runtime version

      - name: Import signing key
        id: gpg
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "id=" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KEY" | gpg --batch --import
          echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_OUTPUT"

      - name: Cache build state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('flatpak/*.yml', 'flatpak/*.json') }}
          restore-keys: flatpak-builder-

      - name: Build
        env:
          GPG_ID: ${{ steps.gpg.outputs.id }}
        run: |
          SIGN=(); [ -n "$GPG_ID" ] && SIGN=(--gpg-sign="$GPG_ID")
          mkdir -p site
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean \
            --default-branch="$BRANCH" --repo=site/repo "${SIGN[@]}" \
            build-dir flatpak/$APP_ID.yml
          flatpak build-update-repo --generate-static-deltas --prune "${SIGN[@]}" \
            --title=Mass --default-branch="$BRANCH" site/repo
          flatpak build-bundle site/repo mass.flatpak $APP_ID "$BRANCH" \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Write .flatpakrepo / .flatpakref
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY%%/*}" | tr A-Z a-z)
          URL="https://$OWNER.github.io/${GITHUB_REPOSITORY#*/}"
          KEY=$(cat flatpak/mass-repo.gpg.b64 2>/dev/null || true)
          cat > site/mass.flatpakrepo <<EOR
          [Flatpak Repo]
          Title=Mass
          Url=$URL/repo/
          Homepage=https://github.com/$GITHUB_REPOSITORY
          Comment=Music Assistant desktop player
          GPGKey=$KEY
          EOR
          cat > site/mass.flatpakref <<EOR
          [Flatpak Ref]
          Name=$APP_ID
          Branch=$BRANCH
          Title=Mass
          Url=$URL/repo/
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          SuggestRemoteName=mass
          GPGKey=$KEY
          EOR
          sed -i 's/^ *//' site/mass.flatpakrepo site/mass.flatpakref
          cp mass.flatpak site/
          touch site/.nojekyll
          printf '<!doctype html><meta charset=utf-8><title>Mass</title><h1>Mass Flatpak repo</h1><pre>flatpak install --user %s/mass.flatpakref</pre>' "$URL" > site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: mass-flatpak
          path: mass.flatpak

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

      - name: Attach bundle to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mass.flatpak

  publish:
    needs: build
    # only once signing is set up (tools/setup-flatpak-repo.sh)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.FLATPAK_REPO != 'off'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
