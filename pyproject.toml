[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-matugen"
version = "1.0.0"
description = "Music Assistant desktop player with matugen theming and deep Linux integration"
requires-python = ">=3.12"
dependencies = [
    "music-assistant-client>=1.8",
    "sendspin>=9.0",
    "aiohttp>=3.9",
    "zeroconf>=0.130",
]
# PyGObject, GTK4, libadwaita and libsecret come from the system (pacman).

[project.scripts]
mass = "mass.__main__:main"

[tool.setuptools.packages.find]
include = ["mass*"]
