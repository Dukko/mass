[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-matugen"
version = "1.1.4"
description = "Music Assistant desktop player with matugen theming and deep Linux integration"
requires-python = ">=3.12"
dependencies = [
    "music-assistant-client>=1.8",
    "sendspin>=9.1,<9.2",
    "aiohttp>=3.9",
    "zeroconf>=0.130",
]
# PyGObject, GTK4, libadwaita and libsecret come from the system (pacman).

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.17,<0.18"]

[project.scripts]
mass = "mass.__main__:main"
mass-sendspin = "mass.sendspin_shim:main"

[tool.setuptools.packages.find]
include = ["mass*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
